    <main class="container">

        <h1>Зворотний зв'язок</h1>

        <form class="form" action="https://httpbin.org/post" method="post">

            <label class="form__label" for="name">Ім'я</label>
            <input class="form__input" type="text" id="name" name="name" required>
            <br><br>

            <label class="form__label for="email">Електронна пошта</label>
            <input class="form__input" type="email" id="email" name="email" required>
            <br><br>

            <label class="form__label for="subject">Тема звернення</label>
            <select class="form__select" id="subject" name="subject">
                <option value="question">Запитання</option>
                <option value="suggestion">Пропозиція</option>
                <option value="error">Повідомлення про помилку на сайті</option>
            </select>
            <br><br>

            <label class="form__label for="message">Текст повідомлення</label><br>
            <textarea class="form__textarea" id="message" name="message"
            rows="5" minlength="10" required></textarea>
            <br><br>

            <label class="form__label">
                <input class="form__input" type="checkbox" name="consent" required>
                Погоджуюся на обробку персональних даних
            </label>
            <br><br>

            <button class="form__button" type="submit">Надіслати</button>

        </form>
